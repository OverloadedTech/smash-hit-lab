version: 2
updates:
  # The tooling and editor dependencies are declared as ranges, so a
  # compromised release inside a range would install silently. These pull
  # requests make each change visible.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Workflow actions are pinned to commit SHAs, which never float. Without this
  # they would simply go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
